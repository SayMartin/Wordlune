server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in responses or error pages.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively; never cache index.html itself,
    # otherwise a redeploy can leave old clients pinned to a stale bundle.
    #
    # NOTE: each location below repeats `include .../security-headers.conf`.
    # That is not redundancy — nginx drops inherited add_header directives in
    # any location that declares its own, and two of these set Cache-Control.
    # Without the repeat, the JS bundle and index.html would ship with no
    # security headers at all. See security-headers.conf for the details.
    location /_expo/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA routing: app.config.js sets web.output: 'single', so there is exactly
    # one index.html and every route is resolved client-side by React
    # Navigation's `linking` config in App.tsx. nginx must hand that shell to
    # the browser for a direct hit or a refresh on any route, or a deep link
    # 404s instead of letting the router take over.
    #
    # This is split into "known route" and "everything else" on purpose. A blanket
    # `try_files $uri $uri/ /index.html` answers 200 for *every* URL that ever
    # gets requested, including typos and probes — a soft 404, which Google
    # treats as a low-quality signal and which made /sitemap.xml silently return
    # HTML before this file existed. Unknown paths now get the same shell (so
    # NotFoundScreen still renders) but with an honest 404 status.
    #
    # Keep this list in step with `linking.config.screens` in App.tsx. A route
    # missing here still works — it just answers 404 while rendering correctly,
    # which search engines act on and users never notice.
    #
    # /privacy and /delete-account in particular are the URLs registered with
    # Google Play, so they must resolve 200 on a cold direct hit, not only via
    # in-app navigation.
    location ~ ^/(game|progress|settings|about|login|signup|signout|reset-password|privacy|delete-account)/?$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Real files (bundle assets, favicon, robots.txt, sitemap.xml, og-image.png)
    # are served as themselves; anything else falls through to the 404 handler
    # below rather than being papered over with the SPA shell at status 200.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    # The 404 body is the same SPA shell, so the app still boots and React
    # Navigation's "*" catch-all renders NotFoundScreen — the status line is the
    # only difference, and it is the part crawlers read. 404.html is a copy of
    # index.html made in the Dockerfile. `internal` keeps /404.html itself from
    # being a directly reachable URL.
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        internal;
    }
}
