server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively; never cache index.html itself,
    # otherwise a redeploy can leave old clients pinned to a stale bundle.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: app.config.js sets web.output: 'single', and
    # RootNavigator's routes (game, settings, login, signup, signout,
    # reset-password, about, "*") are all handled client-side by React
    # Navigation's `linking` config in App.tsx — nginx must serve index.html
    # for any of them (or a direct refresh/deep link 404s instead of letting
    # the client-side router take over and show NotFoundScreen for real 404s).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
