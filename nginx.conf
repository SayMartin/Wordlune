server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in responses or error pages.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache hashed build assets aggressively; never cache index.html itself,
    # otherwise a redeploy can leave old clients pinned to a stale bundle.
    #
    # NOTE: each location below repeats `include .../security-headers.conf`.
    # That is not redundancy — nginx drops inherited add_header directives in
    # any location that declares its own, and two of these set Cache-Control.
    # Without the repeat, the JS bundle and index.html would ship with no
    # security headers at all. See security-headers.conf for the details.
    location /_expo/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: app.config.js sets web.output: 'single', and
    # RootNavigator's routes (game, settings, login, signup, signout,
    # reset-password, about, privacy, delete-account, "*") are all handled
    # client-side by React Navigation's `linking` config in App.tsx — nginx
    # must serve index.html for any of them (or a direct refresh/deep link
    # 404s instead of letting the client-side router take over and show
    # NotFoundScreen for real 404s).
    #
    # /privacy and /delete-account in particular are the URLs registered with
    # Google Play, so they must resolve on a cold direct hit, not only via
    # in-app navigation.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
