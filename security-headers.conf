# Security response headers, included from every location block in nginx.conf.
#
# Why a separate file that gets included repeatedly, rather than one set of
# add_header directives at server level: nginx's add_header is NOT inherited
# into a location block that declares any add_header of its own. Two of the
# three locations in nginx.conf set their own Cache-Control, so server-level
# security headers would silently vanish for the JS bundle and for index.html —
# the two responses that matter most. Repeating the include is the documented
# way around that.
#
# `always` makes each header apply to error responses too, not just 2xx.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# CSP calibrated against the actual `expo export --platform web` output:
#
#   script-src 'self'          — verified: dist/index.html contains exactly one
#                                <script src="/_expo/..." defer> and no inline
#                                script, so no 'unsafe-inline' is needed here.
#   style-src 'unsafe-inline'  — required, unavoidable: index.html ships an
#                                inline <style id="expo-reset">, and
#                                react-native-web injects every component style
#                                into a runtime <style> element. A static Expo
#                                web export has no nonce mechanism.
#   connect-src                — PostgREST/auth over https plus Supabase
#                                Realtime over wss (used by useDuelMode and
#                                DuelLobby). Wildcarded at the subdomain rather
#                                than pinned to the project ref so a project
#                                move doesn't silently break the app; the
#                                security difference is marginal.
#   img-src data: blob:        — data: for inline assets, including the SVG
#                                turbulence grain webTheme.ts sets as the page
#                                background; blob: for the object URL used by
#                                the data-export download.
#
# No third-party origins are listed: the app loads no external fonts, scripts,
# or images.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# HSTS is deliberately NOT set here. TLS terminates at the Cloudflare Tunnel,
# so nginx only ever sees plain HTTP and a Strict-Transport-Security header
# from this layer would be both meaningless and easy to get wrong. Enable it in
# the Cloudflare dashboard instead (SSL/TLS -> Edge Certificates -> HSTS).
